openapi: 3.0.3
info:
    title: Phorge API
    version: 0.6.0  # x-release-please-version
    description: |
        Manage tenants, images, instances, memberships and API keys of the Phorge cloud.

        The API creates, reads and deletes the `phorge.fr` objects of the control cluster; Crossplane turns them into
        Incus and OpenFGA objects. Everything it does is asynchronous: a creation is answered once the object exists,
        and the client polls it until it is ready.

        This document grows with the API. It lists the routes that exist, not the ones that are planned.

        ## Authentication

        Send `Authorization: Bearer <credential>`. The credential is one of:

        - an **access token of Authentik** (OIDC, application "Phorge"), for a person. The user is the `email` claim of
          the token. From a terminal, the device code flow gives one.
        - the access token of a **service account** of Authentik, which is an **API key**, for a script, a CI or a tool such
          as OpenTofu. Creating a key (`POST /v1/apikeys`) gives the user name of the account (`identity`) and a key, once;
          the client exchanges them at Authentik for an access token (`client_credentials`, with `client_id`, `username`
          and `password`) and sends that token like any other. The key has only the scopes you gave it on the tenants you
          named, never more than you hold, and nothing from its date of expiry. A key cannot create, read or delete keys:
          that takes a person signed in with Authentik. For now only the platform administrators (a group of Authentik)
          create keys; anyone lists and revokes their own.

        Whatever is wrong with a credential, the answer is the same `401`, so that nothing can be probed.
servers:
    - url: /
tags:
    - name: Identity
    - name: Tenants
    - name: Images
    - name: Networks
    - name: Profiles
    - name: Instances
    - name: Memberships
    - name: API keys
    - name: Operations
paths:
    /v1/whoami:
        get:
            tags:
                - Identity
            operationId: whoami
            summary: Who the API takes you for
            description: |
                Answers with the identity the credential stands for. For a user, `subject` is `user:<email>`, the user of
                every authorization check. A key has its own: `subject` is `apikey:<name>` and `name` is the user name of its service account.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The caller.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Identity"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/limits:
        get:
            tags:
                - Identity
            operationId: getLimits
            summary: What the API enforces on a request
            description: |
                The bounds of an instance (CPU, memory, disk) with the value each takes when a request leaves it out, and the longest
                names. The plan of a tenant is a limit of its own and is not here.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The limits.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Limits"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
    /v1/tenants:
        get:
            tags:
                - Tenants
            operationId: listTenants
            summary: The tenants you can see
            description: |
                The tenants on which you hold a role (with a key: the ones it has `tenants:read` on). The
                platform administrators see all of them.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The tenants, by name.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TenantList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - Tenants
            operationId: createTenant
            summary: Create a tenant
            description: |
                Reserved to the platform administrators. The answer is `202`: the tenant exists but Crossplane takes about a
                minute to make its namespace, its Incus project and its network. Poll the `Location` until `phase` is
                `Ready`. A `phase` of `Failed` comes with `problems`, what is wrong in words made for you; the details of the platform are not shown.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TenantCreate"
            responses:
                "202":
                    description: Accepted, being created.
                    headers:
                        Location:
                            schema:
                                type: string
                                example: /v1/tenants/demo
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tenant"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - Tenants
            operationId: getTenant
            summary: One tenant
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The tenant.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tenant"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        patch:
            tags:
                - Tenants
            operationId: updateTenant
            summary: Change the plan or the display name
            description: |
                Reserved to the platform administrators. The name and the owner cannot change: to hand a tenant over, give
                the new person the `admin` role with a membership.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TenantPatch"
            responses:
                "200":
                    description: The tenant. The new plan is applied by Crossplane within a minute.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tenant"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - Tenants
            operationId: deleteTenant
            summary: Delete a tenant and everything in it
            description: |
                Reserved to the platform administrators. **It destroys the virtual machines of the tenant**, ask for a
                confirmation before calling it.

                The instances, the memberships and the images of the tenant are deleted first, then the tenant itself. The
                deletion is done in the foreground: the answer is `202` and the tenant stays, with the phase `Deleting`,
                until everything it is made of is gone, up to a couple of minutes. A `404` on a later get is what tells it
                is really done.
            security:
                - bearerAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tenant"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/images:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - Images
            operationId: listImages
            summary: The images of a tenant
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The images, by name.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ImageList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - Images
            operationId: createImage
            summary: Pull an image into a tenant
            description: |
                Instances start from an image of their tenant, never from a bare image name. The answer is `202`: pulling a VM
                image takes a few minutes. Poll the `Location` until `phase` is `Ready`. An image that does not exist on its server
                never becomes ready, `problems` says that it could not be pulled.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ImageCreate"
            responses:
                "202":
                    description: Accepted, being pulled.
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Image"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/images/{name}:
        parameters:
            - $ref: "#/components/parameters/tenant"
            - $ref: "#/components/parameters/name"
        get:
            tags:
                - Images
            operationId: getImage
            summary: One image
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The image.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Image"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - Images
            operationId: deleteImage
            summary: Delete an image
            description: |
                An image that an instance still starts from cannot be deleted: the answer is `409` and says which instances.
                Delete them first. For a few seconds after the last one is gone Crossplane still refuses, with a `409` that
                names nobody: try again.
            security:
                - bearerAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Image"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/networks:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - Networks
            operationId: listNetworks
            summary: The networks of a tenant
            description: A tenant comes without a network, its users deploy the ones they need.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The networks, by name.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/NetworkList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - Networks
            operationId: createNetwork
            summary: Deploy a network in a tenant
            description: |
                An OVN network of the tenant, NATed: its instances reach the Internet and are not reachable from it. Its addresses
                are chosen by Incus. The answer is `202`: poll the `Location` until `phase` is `Ready`. The number of networks is
                limited by the plan of the tenant: the next one never becomes ready, and `problems` says that a limit is reached.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/NetworkCreate"
            responses:
                "202":
                    description: Accepted, being deployed.
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Network"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/networks/{name}:
        parameters:
            - $ref: "#/components/parameters/tenant"
            - $ref: "#/components/parameters/name"
        get:
            tags:
                - Networks
            operationId: getNetwork
            summary: One network
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The network.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Network"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - Networks
            operationId: deleteNetwork
            summary: Delete a network
            description: |
                A network that an instance is attached to cannot be deleted: the answer is `409` and says which instances. Delete
                them first. For a few seconds after the last one is gone Crossplane still refuses, with a `409` that names nobody:
                try again.
            security:
                - bearerAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Network"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/profiles:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - Profiles
            operationId: listProfiles
            summary: The sizes an instance of a tenant can take
            description: |
                Every tenant has the profiles `s` (1 vCPU, 2 GiB, 64 GiB), `m` (2, 4, 128) and `l` (4, 8, 256), created with it. An
                instance takes one of them (`profile`) or its own `cpu`, `memoryMiB` and `diskGiB`. The plan of the tenant limits the
                total: a profile whose disk is above the plan's is refused by Incus when an instance asks for it.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The profiles, by size.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ProfileList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/instances:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - Instances
            operationId: listInstances
            summary: The virtual machines of a tenant
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The instances, by name.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InstanceList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - Instances
            operationId: createInstance
            summary: Create a virtual machine
            description: |
                The image has to be an image of the same tenant, and `Ready`. The answer is `202`: it takes about a minute. Poll the
                `Location` until `phase` is `Ready`.

                The quota of the tenant's plan is enforced by Incus, not by this request: a refusal such as `Reached maximum number
                of instances` comes back as `problems` of the instance, in words, and the instance then becomes `Failed`. Stopped VMs count.

                An instance whose first start failed is stuck (the cause is in `problems`): delete it and create it again.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InstanceCreate"
            responses:
                "202":
                    description: Accepted, being created.
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Instance"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/instances/{name}:
        parameters:
            - $ref: "#/components/parameters/tenant"
            - $ref: "#/components/parameters/name"
        get:
            tags:
                - Instances
            operationId: getInstance
            summary: One virtual machine
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The instance.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Instance"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        patch:
            tags:
                - Instances
            operationId: updateInstance
            summary: Start, stop or resize a virtual machine
            description: |
                `running` starts and stops the same VM. A VM that was created or started a moment ago cannot be stopped yet (`409`, code `starting`, with the time left): the system inside does not listen to the shutdown request before it has booted, and the stop would hang. How long the API waits is a setting of the deployment. The CPU, the memory, the disk and the SSH keys are applied live. The image,
                nesting and secure boot cannot change: delete the instance and create another.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InstancePatch"
            responses:
                "200":
                    description: The instance.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Instance"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - Instances
            operationId: deleteInstance
            summary: Delete a virtual machine
            description: |
                **The VM and its disk are destroyed.** The deletion is done in the foreground: the answer is `202` and the instance
                stays, as `Deleting`, until everything it is made of is gone. A `404` on a later get is what tells it is done.
            security:
                - bearerAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Instance"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/memberships:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - Memberships
            operationId: listMemberships
            summary: The roles of the users of a tenant
            description: |
                Only the admins of the tenant, and the keys that have `memberships:read` on it, may read them.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The memberships, by user.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MembershipList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - Memberships
            operationId: createMembership
            summary: Give a user a role on a tenant
            description: |
                There is one membership per user and tenant, and a membership **cannot be edited** (a role is an OpenFGA tuple, which
                cannot be changed in place): to change a role, delete the membership and create another.

                The owner of a tenant already is admin through the tenant itself and cannot be given a membership: to hand a tenant over,
                give someone else the `admin` role. Only users are supported, not groups.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/MembershipCreate"
            responses:
                "202":
                    description: Accepted, the rights are written within a few seconds.
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Membership"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/memberships/{name}:
        parameters:
            - $ref: "#/components/parameters/tenant"
            - $ref: "#/components/parameters/name"
        get:
            tags:
                - Memberships
            operationId: getMembership
            summary: One membership
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The membership.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Membership"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - Memberships
            operationId: deleteMembership
            summary: Take a role away
            description: |
                The membership goes at once, its rights within about a minute: the answer is not an instant revocation.
            security:
                - bearerAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Membership"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/apikeys:
        get:
            tags:
                - API keys
            operationId: listApiKeys
            summary: Your API keys
            description: |
                The keys of the caller, by display name. The keys themselves are never shown again, only what they may do.
                Only a person signed in with Authentik, not a key.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Your keys.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ApiKeyList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - API keys
            operationId: createApiKey
            summary: Create an API key
            description: |
                Creates a service account in Authentik for the key, and gives it the scopes you name on each tenant.
                **The answer holds the key, once**: it is read from the cluster and removed as it is read, so it cannot be shown
                again, keep it. The key is the password, and `identity` the user name, to exchange at Authentik for an access
                token (`client_credentials`).

                A key can never do more than you can: a scope you do not hold on a tenant is refused (`403`, which is also
                the answer for a tenant that does not exist). A key always expires, at `expiresAt` (within the maximum lifetime
                that the deployment sets): from that date, to the second, it holds nothing. Deleting it removes its token and its
                rights.

                If the key cannot be made in time nothing is left behind and the answer is `503`.

                For now only the platform administrators may create keys, and only a person signed in with Authentik: a key
                cannot create a key.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ApiKeyCreate"
            responses:
                "201":
                    description: Created. The key is in the answer, once.
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ApiKey"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/apikeys/{id}:
        parameters:
            - $ref: "#/components/parameters/keyId"
        get:
            tags:
                - API keys
            operationId: getApiKey
            summary: One of your API keys
            description: Someone else's key is answered `404`, as if it did not exist.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The key, without its secret.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ApiKey"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        patch:
            tags:
                - API keys
            operationId: updateApiKey
            summary: Rename a key
            description: |
                Only the name of a key changes. What it may do and until when are fixed: delete the key and create another.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ApiKeyPatch"
            responses:
                "200":
                    description: The key.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ApiKey"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - API keys
            operationId: deleteApiKey
            summary: Revoke an API key
            description: |
                The key stops working at once. Anyone may revoke their own keys, administrator or not.
            security:
                - bearerAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ApiKey"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /healthz:
        get:
            tags:
                - Operations
            operationId: healthz
            summary: The process is alive
            description: Used by the liveness probe. It stays `200` while the API shuts down, so that the pod is not restarted.
            security: []
            responses:
                "200":
                    description: Alive.
    /readyz:
        get:
            tags:
                - Operations
            operationId: readyz
            summary: The process takes traffic
            description: Used by the readiness probe. It answers `503` while the API shuts down.
            security: []
            responses:
                "200":
                    description: Ready.
                "503":
                    description: Shutting down.
                    content:
                        text/plain:
                            schema:
                                type: string
    /metrics:
        get:
            tags:
                - Operations
            operationId: metrics
            summary: Prometheus metrics
            security: []
            responses:
                "200":
                    description: Metrics in the Prometheus text format.
                    content:
                        text/plain:
                            schema:
                                type: string
    /openapi.yaml:
        get:
            tags:
                - Operations
            operationId: openapi
            summary: This document
            security: []
            responses:
                "200":
                    description: The OpenAPI document.
                    content:
                        application/yaml:
                            schema:
                                type: string
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: An access token of Authentik, of a person or of the service account of an API key. Paste the token only, without `Bearer`.
    parameters:
        keyId:
            name: id
            in: path
            required: true
            description: The id of the key, the name of its object.
            schema:
                type: string
                pattern: '^[0-9a-f]{16}$'
                example: 0123456789abcdef
        tenant:
            name: t
            in: path
            required: true
            description: The name of the tenant, 2 to 28 lowercase letters, digits and hyphens, starting with a letter.
            schema:
                type: string
                pattern: '^[a-z][a-z0-9-]{1,27}$'
                example: demo
        name:
            name: name
            in: path
            required: true
            description: The name of the image or of the instance, 1 to 63 lowercase letters, digits and hyphens.
            schema:
                type: string
                pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                example: web
    responses:
        BadRequest:
            description: The body is not JSON, holds a field the API does not know (an `owner` in a patch, for instance) or is too large.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Forbidden:
            description: You can see the tenant but you are not allowed to do this on it.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        NotFound:
            description: |
                No such tenant, or a tenant you have no right on: the two are not told apart, a tenant that is not yours is
                not shown to exist.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Conflict:
            description: A tenant of that name already exists.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Invalid:
            description: A field is not valid, the message says which.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Unauthenticated:
            description: The credential is missing, wrong, expired or revoked.
            headers:
                WWW-Authenticate:
                    schema:
                        type: string
                        example: Bearer realm="phorge"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Unavailable:
            description: The credential could not be checked, Authentik or the Kubernetes API does not answer. Try again.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
    schemas:
        Phase:
            type: string
            description: |
                `Provisioning`: being made or changed. `Ready`: everything is up. `Failed`: not ready for more than 3 minutes
                with `problems`. `Deleting`.
            enum:
                - Provisioning
                - Ready
                - Failed
                - Deleting
        ImageSource:
            type: object
            required:
                - name
            properties:
                name:
                    type: string
                    description: The name of the image on its server.
                    example: debian/13/cloud
                remote:
                    type: string
                    description: The image server. Only `images` (linuxcontainers.org) is allowed, which is also the default.
                    enum:
                        - images
                    default: images
        Image:
            type: object
            required:
                - name
                - source
                - aliases
                - phase
                - createdAt
            properties:
                name:
                    type: string
                    example: debian
                source:
                    $ref: "#/components/schemas/ImageSource"
                aliases:
                    type: array
                    items:
                        type: string
                fingerprint:
                    type: string
                    description: The SHA-256 of the image, once it is pulled.
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                    description: |
                        What is wrong, in a sentence made for the user: a limit of the plan that is reached, an image that does not
                        boot, or that the platform could not complete a step yet. Never a Crossplane condition or a provider error.
                        Absent when all is well.
                createdAt:
                    type: string
                    format: date-time
                createdBy:
                    type: string
        ImageList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Image"
        ImageCreate:
            type: object
            additionalProperties: false
            required:
                - name
                - source
            properties:
                name:
                    type: string
                    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                    example: debian
                source:
                    $ref: "#/components/schemas/ImageSource"
                aliases:
                    type: array
                    maxItems: 10
                    items:
                        type: string
                        pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
        Profile:
            type: object
            required:
                - name
                - cpu
                - memoryMiB
                - diskGiB
                - builtin
            properties:
                name:
                    type: string
                    example: m
                description:
                    type: string
                cpu:
                    type: integer
                memoryMiB:
                    type: integer
                diskGiB:
                    type: integer
                builtin:
                    type: boolean
                    description: Created with the tenant, and not changeable. The profiles a user makes are not.
        ProfileList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Profile"
        Limit:
            type: object
            required:
                - min
                - max
                - default
            properties:
                min:
                    type: integer
                max:
                    type: integer
                default:
                    type: integer
        Limits:
            type: object
            required:
                - instance
                - network
            properties:
                instance:
                    type: object
                    required:
                        - cpu
                        - memoryMiB
                        - diskGiB
                        - maxSshPublicKeys
                        - maxNameLength
                    properties:
                        cpu:
                            $ref: "#/components/schemas/Limit"
                        memoryMiB:
                            $ref: "#/components/schemas/Limit"
                        diskGiB:
                            $ref: "#/components/schemas/Limit"
                        maxSshPublicKeys:
                            type: integer
                        maxNameLength:
                            type: integer
                network:
                    type: object
                    required:
                        - maxNameLength
                        - maxDescriptionLength
                    properties:
                        maxNameLength:
                            type: integer
                        maxDescriptionLength:
                            type: integer
        Network:
            type: object
            required:
                - name
                - phase
                - createdAt
            properties:
                name:
                    type: string
                    example: net
                description:
                    type: string
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                    description: |
                        What is wrong, in a sentence made for the user: a limit of the plan that is reached, or that the platform could
                        not complete a step yet. Never a Crossplane condition or a provider error. Absent when all is well.
                createdAt:
                    type: string
                    format: date-time
                createdBy:
                    type: string
        NetworkList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Network"
        NetworkCreate:
            type: object
            additionalProperties: false
            required:
                - name
            properties:
                name:
                    type: string
                    pattern: '^[a-z]([a-z0-9-]{0,13}[a-z0-9])?$'
                    description: 1 to 15 characters, the limit of Incus.
                    example: net
                description:
                    type: string
                    maxLength: 200
        Instance:
            type: object
            required:
                - name
                - image
                - cpu
                - memoryMiB
                - diskGiB
                - running
                - nesting
                - secureBoot
                - sshPublicKeys
                - phase
                - createdAt
            properties:
                name:
                    type: string
                    example: web
                image:
                    type: string
                    description: The image of the tenant it started from.
                    example: debian
                network:
                    type: string
                    description: The network the instance is attached to (`eth0`).
                    example: net
                profile:
                    type: string
                    description: The profile the instance has for its size, when it has one. Then `cpu`, `memoryMiB` and `diskGiB` are what the profile comes to.
                    example: m
                cpu:
                    type: integer
                memoryMiB:
                    type: integer
                diskGiB:
                    type: integer
                running:
                    type: boolean
                nesting:
                    type: boolean
                secureBoot:
                    type: boolean
                sshPublicKeys:
                    type: array
                    items:
                        type: string
                state:
                    type: string
                    description: What Incus reports, once the VM exists.
                    example: Running
                transition:
                    type: string
                    enum:
                        - starting
                        - stopping
                    description: |
                        What the VM is doing while its `state` is not the one `running` asks for. Absent when it is where it
                        should be. A transition that lasts longer than the deployment allows is also reported in `problems`.
                transitionSince:
                    type: string
                    format: date-time
                    description: When the change was asked for (the creation, or the last patch of `running`).
                ipv4:
                    type: string
                    description: The address on the network of the tenant.
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                    description: |
                        What is wrong, in a sentence made for the user (a quota that is reached, an image that does not boot). Never a
                        Crossplane condition or a provider error. Absent when all is well.
                createdAt:
                    type: string
                    format: date-time
                createdBy:
                    type: string
        InstanceList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Instance"
        InstanceCreate:
            type: object
            additionalProperties: false
            required:
                - name
                - image
            properties:
                name:
                    type: string
                    pattern: '^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'
                    example: web
                image:
                    type: string
                    description: An image of the tenant, `Ready`.
                    example: debian
                network:
                    type: string
                    pattern: '^[a-z]([a-z0-9-]{0,13}[a-z0-9])?$'
                    description: |
                        A network of the tenant, `Ready`. It can be left out when the tenant has exactly one, which is then used: with
                        none or several the request is refused (`422`) and says so.
                    example: net
                profile:
                    type: string
                    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$'
                    description: |
                        The size of the instance, a profile of the tenant (`s`, `m`, `l`, see `GET /v1/tenants/{t}/profiles`). Give it or
                        `cpu`, `memoryMiB` and `diskGiB`, never both (`422`).
                    example: m
                cpu:
                    type: integer
                    description: A custom size. What is left out takes the value of `GET /v1/limits`.
                    minimum: 1
                    maximum: 16
                memoryMiB:
                    type: integer
                    minimum: 256
                    maximum: 65536
                diskGiB:
                    type: integer
                    minimum: 1
                    maximum: 500
                running:
                    type: boolean
                    default: true
                nesting:
                    type: boolean
                    description: Allow virtual machines or containers inside this VM.
                    default: false
                secureBoot:
                    type: boolean
                    description: UEFI secure boot. Some cloud images do not boot with it (`alpine/3.22/cloud`), set it to false for those.
                    default: true
                sshPublicKeys:
                    type: array
                    maxItems: 20
                    description: |
                        Injected with cloud-init, so the image must be a `cloud` variant. Each key is one line: its type
                        (`ssh-ed25519`, `ssh-rsa`, `ecdsa-sha2-nistp256`/`384`/`521`, `sk-ssh-ed25519@openssh.com`,
                        `sk-ecdsa-sha2-nistp256@openssh.com`), the key in base64 and, at most, a comment of one word made of letters,
                        digits and `@._+=/-`. Nothing else is accepted, on purpose.
                    items:
                        type: string
        InstancePatch:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                profile:
                    type: string
                    description: |
                        Move the instance to a profile: its own size is removed. Not with `cpu`, `memoryMiB` or `diskGiB`. An instance that has
                        a profile leaves it by being given the three values together.
                running:
                    type: boolean
                cpu:
                    type: integer
                    minimum: 1
                    maximum: 16
                memoryMiB:
                    type: integer
                    minimum: 256
                    maximum: 65536
                diskGiB:
                    type: integer
                    minimum: 1
                    maximum: 500
                sshPublicKeys:
                    type: array
                    maxItems: 20
                    items:
                        type: string
        Role:
            type: string
            description: |
                `admin`: everything on the tenant, memberships included. `operator`: manage instances and images.
                `user`: create and use instances. `viewer`: read only. Each holds what the next holds.
            enum:
                - admin
                - operator
                - user
                - viewer
        Scope:
            type: string
            description: |
                What an API key may do on a tenant. `instances:write` does not give `instances:read`. `tenants:read` reads the
                tenant. A key never creates, resizes or deletes tenants: that is for the platform administrators.
            enum:
                - tenants:read
                - instances:read
                - instances:write
                - images:read
                - images:write
                - memberships:read
                - memberships:write
        Grant:
            type: object
            additionalProperties: false
            required:
                - tenant
                - scopes
            properties:
                tenant:
                    type: string
                    description: The name of the tenant.
                    example: demo
                scopes:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        $ref: "#/components/schemas/Scope"
        MembershipSubject:
            type: object
            required:
                - kind
                - name
            properties:
                kind:
                    type: string
                    description: Only `User` for now.
                    enum:
                        - User
                name:
                    type: string
                    description: The email of the user, exactly as it is in Authentik (case included).
                    example: bob@example.org
        Membership:
            type: object
            required:
                - name
                - subject
                - role
                - phase
                - createdAt
            properties:
                name:
                    type: string
                    description: Derived from the user, so that a user has one membership per tenant.
                    example: m-0123456789abcdef01234567
                subject:
                    $ref: "#/components/schemas/MembershipSubject"
                role:
                    $ref: "#/components/schemas/Role"
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                createdBy:
                    type: string
        MembershipList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Membership"
        MembershipCreate:
            type: object
            additionalProperties: false
            required:
                - subject
                - role
            properties:
                subject:
                    $ref: "#/components/schemas/MembershipSubject"
                role:
                    $ref: "#/components/schemas/Role"
        ApiKey:
            type: object
            required:
                - id
                - owner
                - displayName
                - grants
                - identity
                - expired
                - phase
                - createdAt
            properties:
                id:
                    type: string
                    description: The name of the object.
                    example: 0123456789abcdef
                owner:
                    type: string
                    description: The user the key belongs to, who created it.
                    example: alice@example.org
                displayName:
                    type: string
                grants:
                    type: array
                    items:
                        $ref: "#/components/schemas/Grant"
                identity:
                    type: string
                    description: The user name of the service account, to exchange the key for a token at Authentik.
                    example: apikey-0123456789abcdef
                expiresAt:
                    type: string
                    format: date-time
                expired:
                    type: boolean
                    description: The date has passed. The key then grants nothing.
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                key:
                    type: string
                    description: The key, the password of the service account. In the answer to the creation only, never again.
        ApiKeyList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/ApiKey"
        ApiKeyCreate:
            type: object
            additionalProperties: false
            required:
                - displayName
                - grants
                - expiresAt
            properties:
                displayName:
                    type: string
                    minLength: 1
                    maxLength: 100
                    example: CI of the infra
                grants:
                    type: array
                    minItems: 1
                    maxItems: 50
                    items:
                        $ref: "#/components/schemas/Grant"
                expiresAt:
                    type: string
                    format: date-time
                    description: In the future, and within the maximum lifetime of a key when the deployment sets one. A key always expires.
        ApiKeyPatch:
            type: object
            additionalProperties: false
            required:
                - displayName
            properties:
                displayName:
                    type: string
                    minLength: 1
                    maxLength: 100
        Plan:
            type: string
            description: |
                The quota of the tenant, enforced by Incus. `small`: 1 VM, 2 vCPU, 4 GiB, 20 GiB of disk, 1 network.
                `medium`: 3, 4, 8, 100, 2. `large`: 6, 8, 16, 250, 3.
            enum:
                - small
                - medium
                - large
        Tenant:
            type: object
            required:
                - name
                - owner
                - plan
                - phase
                - createdAt
            properties:
                name:
                    type: string
                    example: demo
                displayName:
                    type: string
                    maxLength: 100
                owner:
                    type: string
                    description: Email of the owner, who is `admin` of the tenant. It cannot change.
                    example: alice@example.org
                plan:
                    $ref: "#/components/schemas/Plan"
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                    description: What is wrong with the composed resources, as Incus or OpenFGA says it. Absent when all is well.
                namespace:
                    type: string
                    description: The Kubernetes namespace of the tenant, once it is made.
                    example: t-demo
                incusProject:
                    type: string
                    description: The Incus project of the tenant, once it is made.
                    example: t-demo
                createdAt:
                    type: string
                    format: date-time
                createdBy:
                    type: string
                    description: Who created it through the API.
        TenantList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Tenant"
        TenantCreate:
            type: object
            additionalProperties: false
            required:
                - name
                - owner
            properties:
                name:
                    type: string
                    pattern: '^[a-z][a-z0-9-]{1,27}$'
                    example: demo
                owner:
                    type: string
                    description: Email of the owner, exactly as it is in Authentik (case included).
                    example: alice@example.org
                plan:
                    $ref: "#/components/schemas/Plan"
                displayName:
                    type: string
                    maxLength: 100
        TenantPatch:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                plan:
                    $ref: "#/components/schemas/Plan"
                displayName:
                    type: string
                    maxLength: 100
        Identity:
            type: object
            required:
                - kind
                - subject
                - platformAdmin
            properties:
                kind:
                    type: string
                    enum:
                        - user
                        - servicekey
                    description: |
                        `servicekey` is a service account of Authentik that holds an API key: it has no owner and no
                        email, and only the rights OpenFGA holds for its subject.
                subject:
                    type: string
                    description: The user of the authorization checks. `apikey:<name>` for a service key.
                    example: user:alice@example.org
                email:
                    type: string
                    description: The email claim, exactly as Authentik gives it. A key has none.
                    example: alice@example.org
                name:
                    type: string
                    description: The user name of the service account of a key. Keys only.
                    example: apikey-0123456789abcdef
                platformAdmin:
                    type: boolean
                    description: |
                        The caller may create, resize and delete tenants: a user that belongs to the platform
