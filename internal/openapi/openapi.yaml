openapi: 3.0.3
info:
    title: Phorge API
    version: 0.1.0
    description: |
        Manage tenants, images, instances, memberships and API keys of the Phorge cloud.

        The API creates, reads and deletes the `phorge.fr` objects of the control cluster; Crossplane turns them into
        Incus and OpenFGA objects. Everything it does is asynchronous: a creation is answered once the object exists,
        and the client polls it until it is ready.

        This document grows with the API. It lists the routes that exist, not the ones that are planned.

        ## Authentication

        Send `Authorization: Bearer <credential>`. The credential is one of:

        - an **access token of Authentik** (OIDC, application "Phorge"), for a person. The user is the `email` claim of
          the token. From a terminal, the device code flow gives one.
        - an **API key** `phk_<tenant>_<name>_<secret>`, for a machine. It works on its tenant only, with the scopes it
          was given.

        Whatever is wrong with a credential, the answer is the same `401`, so that nothing can be probed.
servers:
    - url: /
tags:
    - name: Identity
    - name: Tenants
    - name: Images
    - name: Instances
    - name: Memberships
    - name: API keys
    - name: Operations
paths:
    /v1/whoami:
        get:
            tags:
                - Identity
            operationId: whoami
            summary: Who the API takes you for
            description: |
                Answers with the identity the credential stands for. For a user, `subject` is `user:<email>`, the user of
                every authorization check; for a key, `apikey:<tenant>.<name>`.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The caller.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Identity"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants:
        get:
            tags:
                - Tenants
            operationId: listTenants
            summary: The tenants you can see
            description: |
                The tenants on which you hold a role, or that your key was made for. The platform administrators see all of
                them.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The tenants, by name.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TenantList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - Tenants
            operationId: createTenant
            summary: Create a tenant
            description: |
                Reserved to the platform administrators. The answer is `202`: the tenant exists but Crossplane takes about a
                minute to make its namespace, its Incus project and its network. Poll the `Location` until `phase` is
                `Ready`. A `phase` of `Failed` comes with `problems`, the error of Incus or OpenFGA as it is.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TenantCreate"
            responses:
                "202":
                    description: Accepted, being created.
                    headers:
                        Location:
                            schema:
                                type: string
                                example: /v1/tenants/demo
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tenant"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - Tenants
            operationId: getTenant
            summary: One tenant
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The tenant.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tenant"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        patch:
            tags:
                - Tenants
            operationId: updateTenant
            summary: Change the plan or the display name
            description: |
                Reserved to the platform administrators. The name and the owner cannot change: to hand a tenant over, give
                the new person the `admin` role with a membership.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TenantPatch"
            responses:
                "200":
                    description: The tenant. The new plan is applied by Crossplane within a minute.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tenant"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - Tenants
            operationId: deleteTenant
            summary: Delete a tenant and everything in it
            description: |
                Reserved to the platform administrators. **It destroys the virtual machines of the tenant**, ask for a
                confirmation before calling it.

                The deletion is done in the foreground: the answer is `202` and the tenant stays, with the phase `Deleting`,
                until everything it is made of is gone, up to a couple of minutes. A `404` on a later get is what tells it
                is really done.
            security:
                - bearerAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tenant"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/images:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - Images
            operationId: listImages
            summary: The images of a tenant
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The images, by name.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ImageList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - Images
            operationId: createImage
            summary: Pull an image into a tenant
            description: |
                Instances start from an image of their tenant, never from a bare image name. The answer is `202`: pulling a VM
                image takes a few minutes. Poll the `Location` until `phase` is `Ready`. An image that does not exist on its server
                never becomes ready, `problems` says so as Incus does.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ImageCreate"
            responses:
                "202":
                    description: Accepted, being pulled.
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Image"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/images/{name}:
        parameters:
            - $ref: "#/components/parameters/tenant"
            - $ref: "#/components/parameters/name"
        get:
            tags:
                - Images
            operationId: getImage
            summary: One image
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The image.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Image"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - Images
            operationId: deleteImage
            summary: Delete an image
            description: |
                An image that an instance still starts from cannot be deleted: the answer is `409` and says which instances.
                Delete them first. For a few seconds after the last one is gone Crossplane still refuses, with a `409` that
                names nobody: try again.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Image"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/instances:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - Instances
            operationId: listInstances
            summary: The virtual machines of a tenant
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The instances, by name.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InstanceList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - Instances
            operationId: createInstance
            summary: Create a virtual machine
            description: |
                The image has to be an image of the same tenant, and `Ready`. The answer is `202`: it takes about a minute. Poll the
                `Location` until `phase` is `Ready`.

                The quota of the tenant's plan is enforced by Incus, not by this request: a refusal such as `Reached maximum number
                of instances` comes back as `problems` of the instance, which then becomes `Failed`. Stopped VMs count.

                An instance whose first start failed is stuck (the cause is in `problems`): delete it and create it again.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InstanceCreate"
            responses:
                "202":
                    description: Accepted, being created.
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Instance"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/instances/{name}:
        parameters:
            - $ref: "#/components/parameters/tenant"
            - $ref: "#/components/parameters/name"
        get:
            tags:
                - Instances
            operationId: getInstance
            summary: One virtual machine
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The instance.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Instance"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        patch:
            tags:
                - Instances
            operationId: updateInstance
            summary: Start, stop or resize a virtual machine
            description: |
                `running` starts and stops the same VM. The CPU, the memory, the disk and the SSH keys are applied live. The image,
                nesting and secure boot cannot change: delete the instance and create another.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InstancePatch"
            responses:
                "200":
                    description: The instance.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Instance"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - Instances
            operationId: deleteInstance
            summary: Delete a virtual machine
            description: |
                **The VM and its disk are destroyed.** The deletion is done in the foreground: the answer is `202` and the instance
                stays, as `Deleting`, until everything it is made of is gone. A `404` on a later get is what tells it is done.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Instance"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/memberships:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - Memberships
            operationId: listMemberships
            summary: The roles of the users of a tenant
            description: |
                Only the admins of the tenant, and keys with `memberships:read`, may read them.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The memberships, by user.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MembershipList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - Memberships
            operationId: createMembership
            summary: Give a user a role on a tenant
            description: |
                There is one membership per user and tenant, and a membership **cannot be edited** (a role is an OpenFGA tuple, which
                cannot be changed in place): to change a role, delete the membership and create another.

                The owner of a tenant already is admin through the tenant itself and cannot be given a membership: to hand a tenant over,
                give someone else the `admin` role. Only users are supported, not groups.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/MembershipCreate"
            responses:
                "202":
                    description: Accepted, the rights are written within a few seconds.
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Membership"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/memberships/{name}:
        parameters:
            - $ref: "#/components/parameters/tenant"
            - $ref: "#/components/parameters/name"
        get:
            tags:
                - Memberships
            operationId: getMembership
            summary: One membership
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The membership.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Membership"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - Memberships
            operationId: deleteMembership
            summary: Take a role away
            description: |
                The membership goes at once, its rights within about a minute: the answer is not an instant revocation.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Membership"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/apikeys:
        parameters:
            - $ref: "#/components/parameters/tenant"
        get:
            tags:
                - API keys
            operationId: listApiKeys
            summary: The API keys of a tenant
            description: |
                The keys themselves are never shown again, only what they may do.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The keys, by name.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ApiKeyList"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        post:
            tags:
                - API keys
            operationId: createApiKey
            summary: Create an API key
            description: |
                **The answer holds the key, once.** Only its hash is stored, so it cannot be shown again: keep it. Send it as
                `Authorization: Bearer <key>`.

                A key never exceeds its creator: you can only give it scopes you hold yourself on the tenant, and a key can only create
                keys with a subset of its own scopes. A key stops working at its `expiresAt` to the second (the API checks the date
                itself, it does not wait for Crossplane), or as soon as it is deleted.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ApiKeyCreate"
            responses:
                "202":
                    description: Accepted, the rights of the scopes are written within a few seconds.
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ApiKey"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /v1/tenants/{t}/apikeys/{name}:
        parameters:
            - $ref: "#/components/parameters/tenant"
            - $ref: "#/components/parameters/name"
        get:
            tags:
                - API keys
            operationId: getApiKey
            summary: One API key
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "200":
                    description: The key, without its secret.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ApiKey"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
        patch:
            tags:
                - API keys
            operationId: updateApiKey
            summary: Change the scopes, the expiry or the name of a key
            description: |
                Taking a scope away is always allowed and takes effect at once. Adding one is giving it: you must hold it yourself. The
                secret cannot be rotated: delete the key and create another.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ApiKeyPatch"
            responses:
                "200":
                    description: The key.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ApiKey"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/Invalid"
                "503":
                    $ref: "#/components/responses/Unavailable"
        delete:
            tags:
                - API keys
            operationId: deleteApiKey
            summary: Revoke an API key
            description: |
                The key stops working at once. Its rights go within about a minute.
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                "202":
                    description: Being deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ApiKey"
                "401":
                    $ref: "#/components/responses/Unauthenticated"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "503":
                    $ref: "#/components/responses/Unavailable"
    /healthz:
        get:
            tags:
                - Operations
            operationId: healthz
            summary: The process is alive
            description: Used by the liveness probe. It stays `200` while the API shuts down, so that the pod is not restarted.
            security: []
            responses:
                "200":
                    description: Alive.
    /readyz:
        get:
            tags:
                - Operations
            operationId: readyz
            summary: The process takes traffic
            description: Used by the readiness probe. It answers `503` while the API shuts down.
            security: []
            responses:
                "200":
                    description: Ready.
                "503":
                    description: Shutting down.
                    content:
                        text/plain:
                            schema:
                                type: string
    /metrics:
        get:
            tags:
                - Operations
            operationId: metrics
            summary: Prometheus metrics
            security: []
            responses:
                "200":
                    description: Metrics in the Prometheus text format.
                    content:
                        text/plain:
                            schema:
                                type: string
    /openapi.yaml:
        get:
            tags:
                - Operations
            operationId: openapi
            summary: This document
            security: []
            responses:
                "200":
                    description: The OpenAPI document.
                    content:
                        application/yaml:
                            schema:
                                type: string
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: An access token of Authentik. Paste the token only, without `Bearer`.
        apiKeyAuth:
            type: http
            scheme: bearer
            bearerFormat: phk_<tenant>_<name>_<secret>
            description: An API key of a tenant. Paste the key only, without `Bearer`.
    parameters:
        tenant:
            name: t
            in: path
            required: true
            description: The name of the tenant, 2 to 28 lowercase letters, digits and hyphens, starting with a letter.
            schema:
                type: string
                pattern: '^[a-z][a-z0-9-]{1,27}$'
                example: demo
        name:
            name: name
            in: path
            required: true
            description: The name of the image or of the instance, 1 to 63 lowercase letters, digits and hyphens.
            schema:
                type: string
                pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                example: web
    responses:
        BadRequest:
            description: The body is not JSON, holds a field the API does not know (an `owner` in a patch, for instance) or is too large.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Forbidden:
            description: You can see the tenant but you are not allowed to do this on it.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        NotFound:
            description: |
                No such tenant, or a tenant you have no right on: the two are not told apart, a tenant that is not yours is
                not shown to exist.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Conflict:
            description: A tenant of that name already exists.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Invalid:
            description: A field is not valid, the message says which.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Unauthenticated:
            description: The credential is missing, wrong, expired or revoked.
            headers:
                WWW-Authenticate:
                    schema:
                        type: string
                        example: Bearer realm="phorge"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Unavailable:
            description: The credential could not be checked, Authentik or the Kubernetes API does not answer. Try again.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
    schemas:
        Phase:
            type: string
            description: |
                `Provisioning`: being made or changed. `Ready`: everything is up. `Failed`: not ready for more than 3 minutes
                with `problems`. `Deleting`.
            enum:
                - Provisioning
                - Ready
                - Failed
                - Deleting
        ImageSource:
            type: object
            required:
                - name
            properties:
                name:
                    type: string
                    description: The name of the image on its server.
                    example: debian/13/cloud
                remote:
                    type: string
                    description: The image server. Only `images` (linuxcontainers.org) is allowed, which is also the default.
                    enum:
                        - images
                    default: images
        Image:
            type: object
            required:
                - name
                - source
                - aliases
                - phase
                - createdAt
            properties:
                name:
                    type: string
                    example: debian
                source:
                    $ref: "#/components/schemas/ImageSource"
                aliases:
                    type: array
                    items:
                        type: string
                fingerprint:
                    type: string
                    description: The SHA-256 of the image, once it is pulled.
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                    description: What is wrong, as Incus says it. Absent when all is well.
                createdAt:
                    type: string
                    format: date-time
                createdBy:
                    type: string
        ImageList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Image"
        ImageCreate:
            type: object
            additionalProperties: false
            required:
                - name
                - source
            properties:
                name:
                    type: string
                    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                    example: debian
                source:
                    $ref: "#/components/schemas/ImageSource"
                aliases:
                    type: array
                    maxItems: 10
                    items:
                        type: string
                        pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
        Instance:
            type: object
            required:
                - name
                - image
                - cpu
                - memoryMiB
                - diskGiB
                - running
                - nesting
                - secureBoot
                - sshPublicKeys
                - phase
                - createdAt
            properties:
                name:
                    type: string
                    example: web
                image:
                    type: string
                    description: The image of the tenant it started from.
                    example: debian
                cpu:
                    type: integer
                memoryMiB:
                    type: integer
                diskGiB:
                    type: integer
                running:
                    type: boolean
                nesting:
                    type: boolean
                secureBoot:
                    type: boolean
                sshPublicKeys:
                    type: array
                    items:
                        type: string
                state:
                    type: string
                    description: What Incus reports, once the VM exists.
                    example: Running
                ipv4:
                    type: string
                    description: The address on the network of the tenant.
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                    description: What is wrong, as Incus says it (a quota that is reached, an image that does not boot). Absent when all is well.
                createdAt:
                    type: string
                    format: date-time
                createdBy:
                    type: string
        InstanceList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Instance"
        InstanceCreate:
            type: object
            additionalProperties: false
            required:
                - name
                - image
            properties:
                name:
                    type: string
                    pattern: '^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'
                    example: web
                image:
                    type: string
                    description: An image of the tenant, `Ready`.
                    example: debian
                cpu:
                    type: integer
                    minimum: 1
                    maximum: 16
                    default: 1
                memoryMiB:
                    type: integer
                    minimum: 256
                    maximum: 65536
                    default: 1024
                diskGiB:
                    type: integer
                    minimum: 1
                    maximum: 500
                    default: 10
                running:
                    type: boolean
                    default: true
                nesting:
                    type: boolean
                    description: Allow virtual machines or containers inside this VM.
                    default: false
                secureBoot:
                    type: boolean
                    description: UEFI secure boot. Some cloud images do not boot with it (`alpine/3.22/cloud`), set it to false for those.
                    default: true
                sshPublicKeys:
                    type: array
                    maxItems: 20
                    description: |
                        Injected with cloud-init, so the image must be a `cloud` variant. Each key is one line: its type
                        (`ssh-ed25519`, `ssh-rsa`, `ecdsa-sha2-nistp256`/`384`/`521`, `sk-ssh-ed25519@openssh.com`,
                        `sk-ecdsa-sha2-nistp256@openssh.com`), the key in base64 and, at most, a comment of one word made of letters,
                        digits and `@._+=/-`. Nothing else is accepted, on purpose.
                    items:
                        type: string
        InstancePatch:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                running:
                    type: boolean
                cpu:
                    type: integer
                    minimum: 1
                    maximum: 16
                memoryMiB:
                    type: integer
                    minimum: 256
                    maximum: 65536
                diskGiB:
                    type: integer
                    minimum: 1
                    maximum: 500
                sshPublicKeys:
                    type: array
                    maxItems: 20
                    items:
                        type: string
        Role:
            type: string
            description: |
                `admin`: everything on the tenant, memberships and keys included. `operator`: manage instances and images.
                `user`: create and use instances. `viewer`: read only. Each holds what the next holds.
            enum:
                - admin
                - operator
                - user
                - viewer
        Scope:
            type: string
            description: What an API key may do on its tenant. `instances:write` does not give `instances:read`.
            enum:
                - tenant:read
                - instances:read
                - instances:write
                - images:read
                - images:write
                - memberships:read
                - memberships:write
        MembershipSubject:
            type: object
            required:
                - kind
                - name
            properties:
                kind:
                    type: string
                    description: Only `User` for now.
                    enum:
                        - User
                name:
                    type: string
                    description: The email of the user, exactly as it is in Authentik (case included).
                    example: bob@example.org
        Membership:
            type: object
            required:
                - name
                - subject
                - role
                - phase
                - createdAt
            properties:
                name:
                    type: string
                    description: Derived from the user, so that a user has one membership per tenant.
                    example: m-0123456789abcdef01234567
                subject:
                    $ref: "#/components/schemas/MembershipSubject"
                role:
                    $ref: "#/components/schemas/Role"
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                createdBy:
                    type: string
        MembershipList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Membership"
        MembershipCreate:
            type: object
            additionalProperties: false
            required:
                - subject
                - role
            properties:
                subject:
                    $ref: "#/components/schemas/MembershipSubject"
                role:
                    $ref: "#/components/schemas/Role"
        ApiKey:
            type: object
            required:
                - name
                - scopes
                - expired
                - phase
                - createdAt
            properties:
                name:
                    type: string
                    example: ci
                displayName:
                    type: string
                scopes:
                    type: array
                    items:
                        $ref: "#/components/schemas/Scope"
                expiresAt:
                    type: string
                    format: date-time
                expired:
                    type: boolean
                    description: The date has passed. The key then grants nothing.
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                createdBy:
                    type: string
                key:
                    type: string
                    description: The key, `phk_<tenant>_<name>_<secret>`. In the answer to the creation only, never again.
                    example: phk_demo_ci_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        ApiKeyList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/ApiKey"
        ApiKeyCreate:
            type: object
            additionalProperties: false
            required:
                - name
                - scopes
            properties:
                name:
                    type: string
                    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                    example: ci
                displayName:
                    type: string
                    maxLength: 100
                scopes:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        $ref: "#/components/schemas/Scope"
                expiresAt:
                    type: string
                    format: date-time
                    description: In the future. Without it the key does not expire.
        ApiKeyPatch:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                scopes:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        $ref: "#/components/schemas/Scope"
                expiresAt:
                    type: string
                    format: date-time
                displayName:
                    type: string
                    maxLength: 100
        Plan:
            type: string
            description: |
                The quota of the tenant, enforced by Incus. `small`: 1 VM, 2 vCPU, 4 GiB, 20 GiB of disk, 1 network.
                `medium`: 3, 4, 8, 100, 2. `large`: 6, 8, 16, 250, 3.
            enum:
                - small
                - medium
                - large
        Tenant:
            type: object
            required:
                - name
                - owner
                - plan
                - phase
                - createdAt
            properties:
                name:
                    type: string
                    example: demo
                displayName:
                    type: string
                    maxLength: 100
                owner:
                    type: string
                    description: Email of the owner, who is `admin` of the tenant. It cannot change.
                    example: alice@example.org
                plan:
                    $ref: "#/components/schemas/Plan"
                phase:
                    $ref: "#/components/schemas/Phase"
                problems:
                    type: string
                    description: What is wrong with the composed resources, as Incus or OpenFGA says it. Absent when all is well.
                namespace:
                    type: string
                    description: The Kubernetes namespace of the tenant, once it is made.
                    example: t-demo
                incusProject:
                    type: string
                    description: The Incus project of the tenant, once it is made.
                    example: t-demo
                createdAt:
                    type: string
                    format: date-time
                createdBy:
                    type: string
                    description: Who created it through the API.
        TenantList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Tenant"
        TenantCreate:
            type: object
            additionalProperties: false
            required:
                - name
                - owner
            properties:
                name:
                    type: string
                    pattern: '^[a-z][a-z0-9-]{1,27}$'
                    example: demo
                owner:
                    type: string
                    description: Email of the owner, exactly as it is in Authentik (case included).
                    example: alice@example.org
                plan:
                    $ref: "#/components/schemas/Plan"
                displayName:
                    type: string
                    maxLength: 100
        TenantPatch:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                plan:
                    $ref: "#/components/schemas/Plan"
                displayName:
                    type: string
                    maxLength: 100
        Identity:
            type: object
            required:
                - kind
                - subject
                - platformAdmin
            properties:
                kind:
                    type: string
                    enum:
                        - user
                        - apikey
                subject:
                    type: string
                    description: The user of the authorization checks.
                    example: user:alice@example.org
                email:
                    type: string
                    description: The email claim, exactly as Authentik gives it. Users only.
                    example: alice@example.org
                tenant:
                    type: string
                    description: The only tenant the key works on. Keys only.
                    example: demo
                name:
                    type: string
                    description: The name of the key. Keys only.
                    example: ci
                platformAdmin:
                    type: boolean
                    description: |
                        The caller may create, resize and delete tenants: a user that belongs to the platform
                        administrators group of Authentik. Always false for a key.
                scopes:
                    type: array
                    description: What the key may do. Keys only.
                    items:
                        type: string
                        enum:
                            - tenant:read
                            - instances:read
                            - instances:write
                            - images:read
                            - images:write
                            - memberships:read
                            - memberships:write
        Error:
            type: object
            required:
                - error
            properties:
                error:
                    type: object
                    required:
                        - code
                        - message
                    properties:
                        code:
                            type: string
                            description: Stable, meant for programs.
                            example: unauthenticated
                        message:
                            type: string
                            description: Meant for people.
