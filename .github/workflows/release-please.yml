name: release-please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            # A token other than GITHUB_TOKEN, so that the release pull request runs the checks and the tag
            # it creates starts the docker workflow (events created with GITHUB_TOKEN trigger nothing).
            - uses: googleapis/release-please-action@v5.0.0
              with:
                  token: '${{ secrets.RENOVATE_TOKEN }}'
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
